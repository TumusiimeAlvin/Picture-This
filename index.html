<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture This!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page-layout">

        <section class="text-side">
            <div class="text-content">
                <h1>Picture This!</h1>
                <h2>My Really Cool Blog Post</h2>
            </div>
        </section>

        <section class="image-side">
            <picture>
                <!-- Square images: 960px and wider -->
                <source
                    media="(min-width: 960px)"
                    srcset="
                        images/square-480.jpg 480w,
                        images/square-640.jpg 640w,
                        images/square-800.jpg 800w,
                        images/square-960.jpg 960w,
                        images/square-1280.jpg 1280w,
                        images/square-1600.jpg 1600w
                    "
                    sizes="50vw"
                >

                <!-- Landscape images: below 960px -->
                <source
                    media="(max-width: 959px)"
                    srcset="
                        images/landscape-320.jpg 320w,
                        images/landscape-480.jpg 480w,
                        images/landscape-640.jpg 640w,
                        images/landscape-720.jpg 720w,
                        images/landscape-960.jpg 960w,
                        images/landscape-1440.jpg 1440w,
                        images/landscape-1920.jpg 1920w
                    "
                    sizes="100vw"
                >

                <img
                    src="images/landscape-480.jpg"
                    alt="Interior of a museum gallery filled with framed paintings"
                >
            </picture>
        </section>

    </main>

</body>
</html>
